apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  labels:
    type: gitops
  name: argo.gitops.platform.upbound.io
spec:
  compositeTypeRef:
    apiVersion: gitops.platform.upbound.io/v1alpha1
    kind: Argo
  mode: Pipeline
  pipeline:
  - functionRef:
      name: upbound-configuration-gitops-argocdcompose-argo
    step: Compose-Argo
  - functionRef:
      name: crossplane-contrib-function-auto-ready
    step: auto-ready
  writeConnectionSecretsToNamespace: upbound-system
